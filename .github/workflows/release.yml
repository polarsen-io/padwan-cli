name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

permissions:
  contents: write
  id-token: write

env:
  UV_NO_SOURCES: true

jobs:
  bump:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.POLARSEN_BOT_PAT }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Configure Git
        run: |
          git config user.name "Polarsen bot"
          git config user.email "bot@polarsen.io"

      - name: Bump version
        run: |
          uv run --only-group=bump cz bump --yes

      - name: Get new version
        id: get_version
        run: |
          VERSION=$(uv run --only-group=bump cz version --project)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build package
        run: uv build

      - name: Extract release notes
        run: |
          awk '/^## /{if(p) exit; p=1} p' CHANGELOG.md > RELEASE_NOTES.md

      - name: Push changes
        run: git push origin master --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          token: ${{ secrets.POLARSEN_BOT_PAT }}

      - name: Publish to PyPI
        run: uv publish
