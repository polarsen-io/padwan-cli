[project]
name = "padwan-cli"
version = "0.6.5"
description = "CLI and TUI for padwan-ai"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "julien.brayere@polarsen.io" }
]
requires-python = ">=3.15.2"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "padwan-ai[realtime]>=0.18.0",
    "piou[tui]>=0.38.2",
    "tracktolib>=0.74.0",
]

[project.urls]
Homepage = "https://polarsen-io.github.io/padwan-cli"
Source = "https://github.com/polarsen-io/padwan-cli"
Changelog = "https://github.com/polarsen-io/padwan-cli/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# `talk` command audio I/O; also needs the PortAudio system lib (libportaudio2).
voice = ["sounddevice>=0.5.6"]
# `--trace otlp`: OTel instrumentation with an OTLP exporter.
otel = [
    "padwan-ai[otel]>=0.18.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
]
# `--trace langfuse`: OTel instrumentation with the Langfuse adapter.
langfuse = ["padwan-ai[langfuse]>=0.18.0"]

[project.scripts]
padwan-cli = "padwan_cli:main_tui"
padwan-talk = "padwan_cli.talk:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.13.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "piou[tui-reload]>=0.38.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    # keep the otel and langfuse extras type-checkable/testable in dev
    "padwan-ai[langfuse]>=0.18.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
]
docs = [
    "zensical>=0.0.74",
]
bump = [
    "commitizen>=4.19.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true
bump_message = "chore(release): release $current_version → $new_version [skip ci]"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# ruff 0.17 widened the defaults; keep the previous rule set
select = ["E4", "E7", "E9", "F"]
