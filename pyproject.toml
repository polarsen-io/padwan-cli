[project]
name = "padwan-cli"
version = "0.6.0"
description = "CLI and TUI for padwan-llm"
readme = "README.md"
authors = [
    { email = "julien.brayere@polarsen.com" }
]
requires-python = ">=3.14"
dependencies = [
    "padwan-llm[realtime]>=0.9.0",
    "piou[tui]>=0.36.0",
    "tracktolib>=0.74.0",
]

[project.optional-dependencies]
# `talk` command audio I/O; also needs the PortAudio system lib (libportaudio2).
voice = ["sounddevice>=0.5"]
# `--trace otlp`: OTel instrumentation with an OTLP exporter.
otel = [
    "padwan-llm[otel]>=0.9.0",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp>=1.44",
]
# `--trace langfuse`: OTel instrumentation with the Langfuse adapter.
langfuse = ["padwan-llm[langfuse]>=0.9.0"]

[project.scripts]
padwan-cli = "padwan_cli:main_tui"
padwan-talk = "padwan_cli.talk:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "piou[tui-reload]>=0.36.0",
    "pyright>=1.1.408",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.11.0",
    # keep the otel and langfuse extras type-checkable/testable in dev
    "padwan-llm[langfuse]>=0.9.0",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp>=1.44",
]
docs = [
    "zensical>=0.0.31",
]
bump = [
    "commitizen>=4.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true
bump_message = "chore(release): release $current_version → $new_version [skip ci]"

[tool.pytest.ini_options]
asyncio_mode = "auto"
